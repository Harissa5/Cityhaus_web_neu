<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Ausstellungen im Cityhaus Weinfelden." />
    <title>Ausstellungen — Cityhaus</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <button class="nav-toggle" type="button" aria-label="Menü öffnen" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <nav class="main-nav" aria-label="Hauptmenü">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="ausstellungen.html" class="active">Ausstellungen</a></li>
          <li><a href="kuenstler.html">Künstler</a></li>
          <li><a href="presse.html">Presse</a></li>
          <li><a href="ueber-uns.html">Über uns</a></li>
          <li><a href="kontakt.html">Kontakt</a></li>
        </ul>
      </nav>

      <div class="brand" aria-label="Cityhaus logo">
        <img src="assets/Logo_Cityhaus.png" alt="Cityhaus Logo" />
        <div class="brand-location">Weinfelden</div>
      </div>
    </header>

    <main class="page-shell">
      <section class="page-intro">
        <p class="eyebrow">Pop-up Galerie im Cityhaus.</p>
      </section>

      <section class="exhibition-list">
        <article class="exhibit-row">
          <div class="exhibit-image">
            <img src="assets/Startseite_Aktuell.png" alt="Lichtpunkte von Helmut Wenczel" />
          </div>
          <div class="exhibit-copy">
            <h2>Helmut Wenczel</h2>
            <p class="exhibit-title">Lichtpunkte</p>
            <p class="exhibit-dates">16.10. – 19.12.2026</p>
          </div>
        </article>

        <article class="exhibit-row reverse">
          <div class="exhibit-image">
            <img src="assets/Ausstellung_Erna.png" alt="Erna Hürzeler Mädesüss trifft Teufelskralle" />
          </div>
          <div class="exhibit-copy">
            <h2>Erna Hürzeler</h2>
            <p class="exhibit-title">Mädesüss trifft Teufelskralle</p>
            <p class="exhibit-dates">18.10.–29.11.2025</p>
          </div>
        </article>

        <article class="exhibit-row">
          <div class="exhibit-image">
            <img src="assets/Ausstellung_Arturo.png" alt="Arturo di Maria Kunst im Lagerraum+" />
          </div>
          <div class="exhibit-copy">
            <h2>Arturo di Maria</h2>
            <p class="exhibit-title">Kunst im Lagerraum+</p>
            <p class="exhibit-dates">01.03.–26.04.2025</p>
          </div>
        </article>
      </section>
    </main>

    <script src="js/script.js"></script>
